name: "Create XCFramework and Deploy Swift-PM"
on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: 'Deployment destination (evaluation skips Package.swift push)'
        type: choice
        options:
          - evaluation
          - production
        default: evaluation
jobs:
  build:
    if: github.ref == 'refs/heads/master' && (inputs.deployment_target == 'evaluation' || inputs.deployment_target == 'production')
    runs-on: macos-15
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure Git
        run: |
          git config user.email "git@users.noreply.github.com"
          git config user.name "github actions"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        env:
          AWS_ROLE_ARN: ${{ inputs.deployment_target == 'production' && 'arn:aws:iam::161473449094:role/ProductionKarteCrashReporterDeployRole' || 'arn:aws:iam::307291217331:role/EvaluationKarteCrashReporterDeployRole' }}
        with:
          aws-region: ap-northeast-1
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: MySessionName
      - name: Select Xcode version
        run: sudo xcode-select -s '/Applications/Xcode_16.4.app'
      - name: Get Release Version
        id: release-version
        run: |
          ruby <<'RUBY' >> "$GITHUB_OUTPUT"
          version = File.read('KarteCrashReporter.podspec')[/^\s*spec\.version\s*=\s*["']([^"']+)["']/, 1]
          abort 'Unable to read release version from podspec' unless version
          puts "VERSION=#{version}"
          RUBY
      - name: Check if it has already been released
        if: inputs.deployment_target == 'production'
        env:
          VERSION: ${{ steps.release-version.outputs.VERSION }}
        run: |
          git fetch --tags
          if git rev-parse --verify --quiet "refs/tags/${VERSION}" > /dev/null; then
            echo "Please bump up version number!!"
            exit 1
          fi
      - name: Generate Swift-PM artifact ID
        id: generate-artifact-id
        run: |
          echo "ARTIFACT_ID=$(printf '%x' "$(date -u +%s)")" >> "$GITHUB_OUTPUT"
      - name: Create XCFramework
        run: xcodebuild -configuration Release -target 'CrashReporter'
      - name: Replace XCFramework
        run: |
          rm -rf CrashReporter.xcframework
          rm -rf KarteCrashReporter.xcframework
          cp -pR build/Release/CrashReporter.xcframework ./
          # Copy and rename framework to avoid conflict with older framework path for uploading to S3
          cp -r CrashReporter.xcframework KarteCrashReporter.xcframework
          zip -r KarteCrashReporter.xcframework.zip KarteCrashReporter.xcframework
      - name: Upload XCFramework to aws s3
        env:
          S3_BUCKET: ${{ inputs.deployment_target == 'production' && 'production-native-sdk' || 'evaluation-native-sdk' }}
          VERSION: ${{ steps.release-version.outputs.VERSION }}
          ARTIFACT_ID: ${{ steps.generate-artifact-id.outputs.ARTIFACT_ID }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          KEY="ios/swiftpm/KarteCrashReporter-${VERSION}/KarteCrashReporter-${ARTIFACT_ID}.xcframework.zip"
          aws s3api put-object \
            --bucket "$S3_BUCKET" \
            --key "$KEY" \
            --body ./KarteCrashReporter.xcframework.zip \
            --acl public-read \
            --if-none-match "*"
      - name: Replace Package.swift
        if: inputs.deployment_target == 'production'
        env:
          VERSION: ${{ steps.release-version.outputs.VERSION }}
          ARTIFACT_ID: ${{ steps.generate-artifact-id.outputs.ARTIFACT_ID }}
        run: |
          rm Package.swift
          cp .KarteTemplate-Package.swift Package.swift

          url="https:\/\/sdk.karte.io\/ios\/swiftpm\/KarteCrashReporter-${VERSION}\/KarteCrashReporter-${ARTIFACT_ID}.xcframework.zip"
          checksum=$(swift package compute-checksum ./KarteCrashReporter.xcframework.zip)

          sed -i "" "s/<__URL__>/url: \"${url}\"/g" "./Package.swift"
          sed -i "" "s/<__CHECKSUM__>/checksum: \"${checksum}\"/g" "./Package.swift"
      - name: Update Swift-PM manifest file
        if: inputs.deployment_target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add Package.swift
          git add CrashReporter.xcframework
          git add KarteCrashReporter.xcframework
          git commit -m "[skip ci] Update xcframework"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')" push
